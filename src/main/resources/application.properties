spring.application.name=callwise
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:callwise}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.security.user.name=${ATENDENTE_USUARIO}
spring.security.user.password=${ATENDENTE_SENHA}