<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Callwise - Totem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="totem">

        <!-- Tela 1: escolha do tipo de atendimento -->
        <section id="tela-escolha" class="tela">
            <header class="cabecalho">
                <p class="marca">Callwise</p>
                <h1>Retire sua senha</h1>
                <p class="instrucao">Toque no tipo de atendimento</p>
            </header>

            <div class="opcoes">
                <button id="btn-normal" class="opcao opcao-normal" type="button">
                    <span class="opcao-icone" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="7.5" r="4"/>
                            <path d="M4 20.2c0-3.9 3.6-6.7 8-6.7s8 2.8 8 6.7c0 .7-.6 1.3-1.3 1.3H5.3c-.7 0-1.3-.6-1.3-1.3z"/>
                        </svg>
                    </span>
                    <span class="opcao-titulo">Normal</span>
                    <span class="opcao-descricao">Atendimento geral</span>
                </button>

                <button id="btn-prioritaria" class="opcao opcao-prioritaria" type="button">
                    <span class="opcao-icone" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="4.6" r="2.3"/>
                            <path d="M4.6 8.1c-.7-.2-1.4.2-1.6.9-.2.7.2 1.4.9 1.6l5.4 1.5v3.300l-2.2 5.300c-.3.7 0 1.400.7 1.700.7.3 1.400 0 1.700-.7l2.500-5.800 2.500 5.800c.3.7 1 1 1.700.7.7-.3 1-1 .7-1.700l-2.200-5.300v-3.300l5.400-1.500c.7-.2 1.100-.9.9-1.600-.2-.7-.9-1.100-1.600-.9L13.600 9.700h-3.200z"/>
                        </svg>
                    </span>
                    <span class="opcao-titulo">Prioritária</span>
                    <span class="opcao-descricao">Idosos, gestantes e pessoas com deficiência</span>
                </button>
            </div>

            <p id="erro" class="erro" role="alert" hidden></p>
        </section>

        <!-- Tela 2: senha emitida -->
        <section id="tela-senha" class="tela" aria-live="polite" hidden>
            <article class="bilhete">
                <div class="bilhete-topo">
                    <p class="bilhete-rotulo">Sua senha</p>
                    <p id="codigo" class="bilhete-codigo"></p>
                </div>
                <div class="bilhete-picote" aria-hidden="true"></div>
                <div class="bilhete-rodape">
                    <p id="tipo" class="bilhete-tipo"></p>
                    <p id="horario" class="bilhete-horario"></p>
                </div>
            </article>

            <p class="aviso">Aguarde ser chamado no painel</p>

            <button id="btn-concluir" class="botao-concluir" type="button">Concluir</button>
            <p id="contagem" class="contagem"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
